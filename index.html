        <!--7/24 最終調整-->
        <!DOCTYPE html>
        <html lang="ja">

        <head>

            <meta charset="UTF-8">

           <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

            <title>まる家計 Ver46</title>

            <link rel="stylesheet" href="style.css">

        </head>

        <body>

        <!-- ホーム -->

        <div id="homePage">

            <!-- 月 -->

            <div class="card summary-card">

                <div class="month-header">

                    <button id="prevMonth">◀</button>

                    <div class="period-area">

                        <select id="yearSelect">

                            <option value="2024">2024年度</option>

                            <option value="2025">2025年度</option>

                            <option value="2026" selected>2026年度</option>

                            <option value="2027">2027年度</option>

                        </select>

                        <h2 id="period">

                            4月

                        </h2>

                    </div>

                    <div class="month-right">

                        <button id="resetMonth" class="mini-reset">

                            🗑

                        </button>

                        <button id="nextMonth">

                            ▶

                        </button>

                    </div>

                </div>

            </div>

         <!-- 今月のお金 -->

        <div class="card">

            <div class="summary-grid">

                <div class="summary-item">

                    <div class="summary-title">
                        収入
                    </div>

                    <div class="summary-money" id="incomeSummary">
                        ¥0
                    </div>

                </div>

                <div class="summary-item">

                    <div class="summary-title">
                        支出
                    </div>

                    <div class="summary-money" id="spent">
                        ¥0
                    </div>

                    <div class="summary-sub" id="spentStatus"></div>

                </div>

                <div class="summary-item">

                    <div class="summary-title">
                        残り
                    </div>

                    <div class="summary-money" id="remain">
                        ¥0
                    </div>

                </div>

            </div>

            <div class="bank-row" onclick="editBank()">

                <span class="bank-label">
                    🏦 銀行残高
                </span>

                <span class="bank-total" id="bankTotal">
                    ¥0
                </span>

                <span class="bank-saving plus" id="savingTotal">
                    ¥0
                </span>

            </div>

        </div>

        <!-- 収入入力 -->
        <div class="card income-quick-card">
            <div class="income-quick-title">💰 収入入力</div>
            <div class="income-quick-grid">
                <button onclick="addIncome('パパ')">👨 パパ</button>
                <button onclick="addIncome('ママ')">👩 ママ</button>
                <button onclick="addIncome('臨時')">🎁 臨時</button>
            </div>
        </div>

            <!-- メモ -->

            <div class="card memo-card">

                <div class="memo-title">📝 メモ</div>

                <textarea
                    id="homeMemo"
                    class="home-memo"
                    placeholder="自由にメモできます"
                    oninput="app.memo=this.value; save();"
                ></textarea>

                <div class="card-budget-note">
                    💳 <strong>カード</strong><br>
                    固定：¥24,504 ／ 月使う：¥24,504<br>
                    変動：あと <strong>¥15,496</strong>
                </div>

                <div class="holiday-plan-home" id="holidayPlanHome"></div>

            </div>

            <!-- カテゴリ -->

            <div class="card">

                <div class="category-header">

                    <h2>📒 カテゴリ</h2>

                </div>

                <div id="gridArea">

                </div>

            </div>
        </div>
        <!-- 年間 -->

        <div id="yearPage" class="page" style="display:none;">

            <div class="card annual-header-card">
                <h2>📅 <span id="yearTitle">2026年度</span></h2>
            </div>

            <div class="card annual-coach-card">
                <h2>🏆 年間コーチ</h2>
                <div id="annualCoach"></div>
            </div>

            <div class="card annual-bank-card">
                <h2>🏦 銀行残高</h2>
                <div class="annual-bank-note">3月末 ¥78,142 → 月ごとの実績</div>
                <div id="bankTrendList"></div>
                <div id="bankTrendDifference" class="bank-trend-difference"></div>
            </div>

            <div class="card bonus-card">
                <h2>🎁 ボーナス</h2>
                <div id="annualBonus"></div>
            </div>

        </div>

        <!-- 特別費 -->

        <div id="annualPage"
             class="page"
             style="display:none;">

            <div class="card">

                <h2>💰 特別費</h2>

            </div>

            <div class="card special-expense-wrap">

                <div id="annualManageList">

                </div>

            </div>

        </div>
            <!-- カテゴリ詳細 -->
        <!-- 特別費カテゴリ詳細 -->

        <div id="categoryPage"
             class="page"
             style="display:none;">

            <div class="card">

                <h2 id="categoryTitle"></h2>

            </div>

            <div class="card">

                <div id="categoryDetailHistory"></div>

            </div>

        </div>
        <!-- 設定 -->

        <div id="settingPage" class="page" style="display:none;">

            <div class="card">

                <h2>⚙️ 設定</h2>

            </div>

            <div class="card">

                <button class="setting-item" id="editGoal">

                    🎯 年間目標

                </button>
                
                <button class="setting-item" id="editAnnualBudget">
            💰 特別費予算
        </button>

                <button class="setting-item" id="annualManage">
                    💰 特別費
                </button>

                <div class="setting-group">

                    <h3>💰 ボーナス管理</h3>

                    <button
                        class="setting-item"
                        id="editBonus">

                        <span>夏・冬ボーナス</span>

                        <span>編集</span>

                    </button>

                </div>

        <button
            class="setting-item"
            onclick="showCategoryList()">

            📒 カテゴリ履歴

        </button>
                
                <div class="setting-group recurring-other-settings">

                    <h3>📦 毎月のその他を自動入力</h3>

                    <div id="recurringOthersList"></div>

                    <button
                        class="setting-item"
                        type="button"
                        onclick="addRecurringOther()">

                        ＋ 毎月かかる項目を追加

                    </button>

                </div>

                <button
                    class="setting-item"
                    onclick="showPage('income')">

                    💰 年間収入履歴

                </button>
        <button class="setting-item" id="backupExport">
            💾 バックアップ保存
        </button>

        <button class="setting-item" id="backupImport">
            📂 バックアップ読込
        </button>

        <input
            type="file"
            id="backupFile"
            accept=".json"
            style="display:none;">
                
                <button
                    class="setting-item danger"
                    id="deleteAll">

                    🗑 全データ削除

                </button>

            </div>

        </div>
        <!-- ボーナス管理 -->

        <div id="bonusPage"
             class="page"
             style="display:none;">

            <div class="card">

                <button
                    class="setting-item"
                    onclick="backPage()">

                    ← 戻る

                </button>

            </div>

            <div class="card">

                <h2>💰 ボーナス管理</h2>

                <div id="bonusContents">

                    <div id="summerBonus" style="display:none;">

                        <h3>🌻 夏ボーナス</h3>

                        <button class="setting-item" id="editSummerBonus">
                            <span>実績入力</span>
                            <span id="summerBonusAmount">¥0</span>
                        </button>

                        <button class="setting-item" id="editSummerKeep">
                            <span>積立額</span>
                            <span id="summerKeepAmount">¥0</span>
                        </button>

                    </div>

                    <div id="winterBonus" style="display:none;">

                        <h3>⛄ 冬ボーナス</h3>

                        <button class="setting-item" id="editWinterBonus">
                            <span>実績入力</span>
                            <span id="winterBonusAmount">¥0</span>
                        </button>

                        <button class="setting-item" id="editWinterKeep">
                            <span>積立額</span>
                            <span id="winterKeepAmount">¥0</span>
                        </button>

                    </div>

                    <p id="bonusMessage">
                        ボーナス月のみ入力できます😊
                    </p>

                </div>

            </div>

        </div>
        <div id="incomePage"
             class="page"
             style="display:none;">

            <div class="card">

                <h2>💰 年間収入履歴</h2>
                
        <div
        style="
        display:flex;
        gap:8px;
        margin-bottom:15px;">

        <button
        id="incomeAllFilter"
        class="setting-item"
        style="flex:1;width:auto;margin:0;padding:12px 4px;text-align:center;"
        onclick="incomeFilter='all';drawIncomeHistory();">

        💰 全部

        </button>

        <button
        id="incomePapaFilter"
        class="setting-item"
        style="flex:1;width:auto;margin:0;padding:12px 4px;text-align:center;"
        onclick="incomeFilter='papa';drawIncomeHistory();">

        👨 パパ

        </button>

        <button
        id="incomeMamaFilter"
        class="setting-item"
        style="flex:1;width:auto;margin:0;padding:12px 4px;text-align:center;"
        onclick="incomeFilter='mama';drawIncomeHistory();">

        👩 ママ

        </button>

        <button
        id="incomeExtraFilter"
        class="setting-item"
        style="flex:1;width:auto;margin:0;padding:12px 4px;text-align:center;"
        onclick="incomeFilter='extra';drawIncomeHistory();">

        🎁 臨時

        </button>

        </div>
                <div id="incomeHistoryList"></div>

            </div>

            </div>

        </div>
        <!-- ナビゲーション -->

        <nav class="bottom-nav">

            <button class="active">

                🏠<br>

                <span>ホーム</span>

            </button>

            <button>

                📊<br>

                <span>年間</span>

            </button>

            <button>

                💰<br>

                <span>特別費</span>

            </button>

            <button>

                ⚙️<br>

                <span>設定</span>

            </button>

        </nav>
        <!-- 数字入力モーダル -->
        <div id="numberModal" class="modal" style="display:none;">

            <div class="modal-box">

                <h2 id="numberTitle">
                    金額入力
                </h2>

                <div id="numberDisplay">
                    ¥0
                </div>
        <label class="number-date-label" for="numberDate">
            🗓 日付
        </label>
        <input
            id="numberDate"
            class="number-date"
            type="date"
            aria-label="入力日付">
        <input
            id="numberMemo"
            class="number-memo"
            type="text"
            placeholder="メモ（任意）">
                
                <div class="number-grid">

                    <button onclick="numberKey('1')">1</button>
                    <button onclick="numberKey('2')">2</button>
                    <button onclick="numberKey('3')">3</button>

                    <button onclick="numberKey('4')">4</button>
                    <button onclick="numberKey('5')">5</button>
                    <button onclick="numberKey('6')">6</button>

                    <button onclick="numberKey('7')">7</button>
                    <button onclick="numberKey('8')">8</button>
                    <button onclick="numberKey('9')">9</button>

                    <button onclick="numberClear()">C</button>
                    <button onclick="numberKey('0')">0</button>
                    <button onclick="numberBack()">⌫</button>

                </div>

                <div class="modal-buttons">

                    <button onclick="closeNumberModal()">
                        キャンセル
                    </button>

                    <button id="numberOk">
                        OK
                    </button>

                </div>

            </div>

        </div>
        <div id="paymentModal" class="modal" style="display:none;">

            <div class="modal-box payment-modal-box">

                <h2>📦 支払い方法</h2>

                <p class="payment-help">
                    その他の支払い方法を選択
                </p>

                <div class="payment-choice-grid">

                    <button
                        type="button"
                        id="paymentCash">
                        🏧 現金
                        <small>ATM残高から引く</small>
                    </button>

                    <button
                        type="button"
                        id="paymentCard">
                        💳 カード
                        <small>ATM残高は減らない</small>
                    </button>

                </div>

                <div class="modal-buttons">

                    <button
                        type="button"
                        id="paymentCancel">
                        キャンセル
                    </button>

                </div>

            </div>

        </div>

        <script src="app.js"></script>

        </body>

        </html>
